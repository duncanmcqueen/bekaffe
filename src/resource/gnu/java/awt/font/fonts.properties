# Font mapping for the Haiku AWT peer (gnu.java.awt.font.OpenTypeFontPeer).
# Haiku ships the DejaVu fonts in /boot/system/data/fonts/ttfonts.

DejaVuSans/p=/boot/system/data/fonts/ttfonts/DejaVuSans.ttf
DejaVuSans/b=/boot/system/data/fonts/ttfonts/DejaVuSans-Bold.ttf
DejaVuSans/bi=/boot/system/data/fonts/ttfonts/DejaVuSans-BoldOblique.ttf
DejaVuSans/i=/boot/system/data/fonts/ttfonts/DejaVuSans-Oblique.ttf

DejaVuSerif/p=/boot/system/data/fonts/ttfonts/DejaVuSerif.ttf
DejaVuSerif/b=/boot/system/data/fonts/ttfonts/DejaVuSerif-Bold.ttf
DejaVuSerif/bi=/boot/system/data/fonts/ttfonts/DejaVuSerif-BoldItalic.ttf
DejaVuSerif/i=/boot/system/data/fonts/ttfonts/DejaVuSerif-Italic.ttf

DejaVuSansMono/p=/boot/system/data/fonts/ttfonts/DejaVuSansMono.ttf
DejaVuSansMono/b=/boot/system/data/fonts/ttfonts/DejaVuSansMono-Bold.ttf
DejaVuSansMono/bi=/boot/system/data/fonts/ttfonts/DejaVuSansMono-BoldOblique.ttf
DejaVuSansMono/i=/boot/system/data/fonts/ttfonts/DejaVuSansMono-Oblique.ttf

Dialog/a=DejaVuSans
DialogInput/a=DejaVuSansMono
Serif/a=DejaVuSerif
SansSerif/a=DejaVuSans
Monospaced/a=DejaVuSansMono

# JDK 1.0 font names, still used by old applets.
TimesRoman/a=DejaVuSerif
Helvetica/a=DejaVuSans
Courier/a=DejaVuSansMono
